<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizza challenge</title>
    <meta name="description" content="Someone challenged you to beat their Quizza score.">
    <link rel="icon" type="image/png" href="../app-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: "Nunito", system-ui, sans-serif;
            background: #F6EFE4;
            color: #1B2A4A;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
        }
        .wrap {
            max-width: 420px;
            width: 100%;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
            font-family: "Fredoka", sans-serif;
            font-weight: 700;
            font-size: 1.4rem;
        }
        .brand img {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            border: 2.5px solid #1B2A4A;
            box-shadow: 4px 4px 0 #1B2A4A;
        }
        .card {
            background: #FFF8EE;
            border: 2.5px solid #1B2A4A;
            border-radius: 18px;
            padding: 32px 28px;
            box-shadow: 8px 8px 0 #E23D28;
        }
        .kicker {
            font-size: 12px;
            letter-spacing: 0.14em;
            font-weight: 800;
            color: #E23D28;
        }
        h1 {
            font-family: "Fredoka", sans-serif;
            font-size: 1.7rem;
            margin: 12px 0 8px;
            line-height: 1.2;
        }
        .score {
            font-family: "Fredoka", sans-serif;
            font-size: 3.4rem;
            font-weight: 700;
            margin: 12px 0;
            color: #E23D28;
        }
        p { margin: 0 0 12px; }
        .actions { display: grid; gap: 10px; margin-top: 24px; }
        a.btn {
            display: block;
            text-align: center;
            text-decoration: none;
            border-radius: 14px;
            padding: 14px 16px;
            font-weight: 800;
            border: 2.5px solid #1B2A4A;
        }
        .primary { background: #E23D28; color: #fff; box-shadow: 4px 4px 0 #1B2A4A; }
        .secondary { background: #FFF8EE; color: #1B2A4A; }
        .fallback { margin-top: 18px; font-size: 0.85rem; color: #4A5568; }
        .fallback a { color: inherit; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="brand">
            <img src="../app-icon.png" alt="Quizza">
            <span>Quizza</span>
        </div>
        <div class="card">
            <div class="kicker">QUIZZA CHALLENGE</div>
            <h1 id="headline">Beat this score</h1>
            <div class="score" id="score">—</div>
            <p id="detail">Open Quizza and play the same category.</p>
            <div class="actions">
                <a class="btn primary" id="open-app" href="quizza://challenge">Open in Quizza</a>
                <a class="btn secondary" href="https://apps.apple.com/app/id6758245751">Download on the App Store</a>
            </div>
            <p class="fallback">No app yet? The App Store button installs Quizza. Then come back to this link.</p>
        </div>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const category = params.get("cn") || params.get("c") || "this quiz";
        const name = params.get("n") || "A friend";
        const score = params.get("s") || "";
        const correct = params.get("a");
        const total = params.get("q");

        document.getElementById("headline").textContent = "Beat " + name + " at " + category;
        if (score) document.getElementById("score").textContent = score;
        let detail = "Play the same category and see who wins.";
        if (correct && total) detail = name + " got " + correct + "/" + total + " correct.";
        document.getElementById("detail").textContent = detail;

        const appLink = "quizza://challenge?" + params.toString();
        document.getElementById("open-app").href = appLink;
        window.setTimeout(function () {
            window.location.href = appLink;
        }, 400);
    </script>
</body>
</html>
