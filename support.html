<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizza - The Trivia Quiz App</title>
    <link rel="icon" type="image/png" href="app-icon.png">
    <link rel="apple-touch-icon" href="app-icon.png">
    <style>
        :root {
            --ink: #0f172a;
            --muted: #475569;
            --line: #e2e8f0;
            --accent: #1d4ed8;
            --bg: #f8fafc;
            --card: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--ink);
            background: var(--bg);
            line-height: 1.7;
        }

        header {
            position: sticky;
            top: 0;
            background: rgba(248, 250, 252, 0.96);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--line);
            z-index: 10;
        }

        .nav {
            max-width: 980px;
            margin: 0 auto;
            padding: 20px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--ink);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            border: 1px solid var(--line);
        }

        .nav-links {
            display: flex;
            gap: 18px;
            font-size: 0.9rem;
        }

        .nav-links a {
            color: var(--muted);
            text-decoration: none;
        }

        .nav-links a:hover {
            color: var(--ink);
        }

        main {
            max-width: 980px;
            margin: 0 auto;
            padding: 64px 24px 80px;
        }

        .hero h1 {
            font-size: 2.4rem;
            letter-spacing: -0.02em;
            margin-bottom: 12px;
        }

        .meta {
            font-size: 0.95rem;
            color: var(--muted);
            margin-bottom: 16px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 16px 40px rgba(15, 23, 42, 0.05);
            max-width: 520px;
        }

        .contact a {
            color: var(--accent);
            text-decoration: none;
        }

        footer {
            max-width: 980px;
            margin: 0 auto;
            padding: 24px;
            border-top: 1px solid var(--line);
            color: var(--muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <header>
        <div class="nav">
            <a class="logo" href="index.html">
                <img class="logo-icon" src="app-icon.png" alt="Quizza app icon">
                <span>Quizza - The Trivia Quiz App</span>
            </a>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="privacy.html">Privacy</a>
                <a href="terms.html">Terms</a>
                <a href="support.html">Support</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="hero">
            <h1>Support</h1>
            <p class="meta">Last updated: January 25, 2026</p>
        </div>

        <div class="card">
            <p>Need help with Quizza? Email us and we’ll respond as soon as possible.</p>
            <p class="contact" style="margin-top: 12px;">
                <a href="mailto:hello@diggolabs.tech">hello@diggolabs.tech</a>
            </p>
        </div>
    </main>

    <footer>
        Quizza - The Trivia Quiz App © 2026 · All rights reserved.
    </footer>
</body>
</html>
